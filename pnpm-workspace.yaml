# pnpm reads dependency settings here (no longer from the package.json "pnpm" field).

# sharp ships a native build script; it was never built under the previous pnpm
# pin and next's image handling works without it, so keep it disabled.
allowBuilds:
  sharp: false

# next 16.3.0 is newer than the supply-chain minimum release age; exclude it
# (and its platform binaries) explicitly so the pinned version installs.
minimumReleaseAgeExclude:
  - "@next/env@16.3.0"
  - "@next/swc-darwin-arm64@16.3.0"
  - "@next/swc-darwin-x64@16.3.0"
  - "@next/swc-linux-arm64-gnu@16.3.0"
  - "@next/swc-linux-arm64-musl@16.3.0"
  - "@next/swc-linux-x64-gnu@16.3.0"
  - "@next/swc-linux-x64-musl@16.3.0"
  - "@next/swc-win32-arm64-msvc@16.3.0"
  - "@next/swc-win32-x64-msvc@16.3.0"
  - next@16.3.0

# The undici override (advisories in < 7.28.0, pulled in via jsdom) was removed
# 2026-08-04: jsdom 30 depends on undici ^8.9.0, which is past the patched line.
